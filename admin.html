<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>রঙতুলি ফ্যাশন হাউজ | Admin Panel</title>

<link rel="stylesheet" href="admin.css">

<script src="admin.js" defer></script>

</head>

<body>

<div class="login-box" id="loginBox">

<h1>রঙতুলি ফ্যাশন হাউজ</h1>

<h2>Admin Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="loginAdmin()">

Login

</button>

<p id="loginMessage"></p>

</div>

<div id="dashboard" style="display:none;">

<h1>রঙতুলি ফ্যাশন হাউজ</h1>

<h2>Admin Dashboard</h2>

<button onclick="showProductForm()">

➕ নতুন পণ্য যোগ করুন

</button>

<button>

📦 সকল পণ্য

</button>

<button>

🛒 অর্ডার

</button>

<button>

👥 গ্রাহক

</button>

<button onclick="logoutAdmin()">

🚪 Logout

</button>

<div id="productForm" style="display:none;">

<h2>নতুন পণ্য যোগ করুন</h2>

<input type="text" placeholder="পণ্যের নাম">

<input type="number" placeholder="দাম">

<input type="text" placeholder="রঙ">

<input type="text" placeholder="সাইজ">

<select>

<option>In Stock</option>

<option>Out of Stock</option>

</select>

<input type="file">

<textarea placeholder="পণ্যের বিবরণ"></textarea>

<button>

💾 Save Product

</button>

</div>

</div>

</body>

</html>
