<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>রঙতুলি ফ্যাশন হাউজ | Admin Panel</title>

<link rel="stylesheet" href="admin.css">

<script src="admin.js" defer></script>

</head>

<body>

<div class="login-box" id="loginBox">

<h1>রঙতুলি ফ্যাশন হাউজ</h1>

<h2>Admin Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="loginAdmin()">Login</button>

<p id="loginMessage"></p>

</div>

<div id="dashboard" style="display:none;">

<h1>Admin Dashboard</h1>

<button onclick="showProductForm()">

➕ নতুন পণ্য যোগ করুন

</button>

<div id="productForm" style="display:none;">

<h2>নতুন পণ্য</h2>

<input id="productName" type="text" placeholder="পণ্যের নাম">

<input id="productPrice" type="number" placeholder="দাম">

<input
type="file"
id="productImage"
accept="image/*"
onchange="previewImage(event)">

<img
id="imagePreview"
style="display:none;width:180px;border-radius:10px;margin:15px 0;">

<button onclick="saveProduct()">

💾 Save Product

</button>

</div>

<h2>📦 Product List</h2>

<div id="productList"></div>

<button onclick="logoutAdmin()">

Logout

</button>

</div>

</body>

</html>
