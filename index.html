<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রঙতুলি ফ্যাশন হাউজ</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

<header class="rt-header">

  <button class="menu-btn">☰</button>

  <div class="logo-box">
    <img src="assets/logo/logo.png" alt="রঙতুলি ফ্যাশন হাউজ">
  </div>

  <div class="brand-box">
    <h1>রঙতুলি ফ্যাশন হাউজ</h1>
    <p>আপনার বিশ্বস্তের ফ্যাশন সঙ্গী</p>
  </div>

  <div class="search-box">
    <input type="text" placeholder="পণ্য খুঁজুন...">
    <button>🔍</button>
  </div>

</header>

<section class="top-banner">

  <img src="assets/banner/banner1.jpg" alt="Banner">

</section>

<nav class="category-bar">

  <button>প্রিমিয়াম</button>

  <button>নতুন</button>

  <button>ডিসকাউন্ট</button>

  <button>টি-শার্ট</button>

  <button>পলো</button>

  <button>শার্ট</button>

  <button>পাঞ্জাবি</button>

  <button>জিন্স</button>

</nav>

<section class="product-section">

<h2>আমাদের কালেকশন</h2>

<div class="product-grid">

<!-- Product Card এখানে যোগ হবে -->

</div>

</section>

</body>
</html>
