<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রঙতুলি ফ্যাশন হাউজ</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

<header class="rt-header">

  <button class="menu-btn">☰</button>

  <div class="logo-box">
    <img src="assets/logo/logo.png" alt="রঙতুলি ফ্যাশন হাউজ">
  </div>

  <div class="brand-box">
    <h1>রঙতুলি ফ্যাশন হাউজ</h1>
    <p>আপনার বিশ্বস্তের ফ্যাশন সঙ্গী</p>
  </div>

  <div class="search-box">
    <input type="text" placeholder="পণ্য খুঁজুন...">
    <button>🔍</button>
  </div>

</header>

<section class="top-banner">

  <img src="assets/banner/banner1.jpg" alt="Banner">

</section>

<nav class="category-bar">

  <button>প্রিমিয়াম</button>

  <button>নতুন</button>

  <button>ডিসকাউন্ট</button>

  <button>টি-শার্ট</button>

  <button>পলো</button>

  <button>শার্ট</button>

  <button>পাঞ্জাবি</button>

  <button>জিন্স</button>

</nav>

<section class="product-section">

<h2>আমাদের কালেকশন</h2>

<div class="product-grid">
<div class="product-card">

  <div class="discount-badge">-20%</div>

  <img src="assets/products/tshirt-01.jpg" alt="টি-শার্ট">

  <div class="product-info">

    <div class="product-name">
      প্রিমিয়াম কটন টি-শার্ট
    </div>

    <div class="product-price">
      ৳990
      <span class="old-price">৳1250</span>
    </div>

    <button class="order-btn">
      অর্ডার করুন
    </button>

  </div>

</div>

<div class="product-card">

  <img src="assets/products/polo-01.jpg" alt="পলো">

  <div class="product-info">

    <div class="product-name">
      প্রিমিয়াম পলো শার্ট
    </div>

    <div class="product-price">
      ৳1290
    </div>

    <button class="order-btn">
      অর্ডার করুন
    </button>

  </div>

</div>
<!-- Product Card এখানে যোগ হবে -->

</div>

</section>

</body>
</html>
