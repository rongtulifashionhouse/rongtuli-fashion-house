<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রঙতুলি ফ্যাশন হাউজ</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<!-- Order Modal -->
<div class="order-modal" id="orderModal">

  <div class="order-box">

    <h2>অর্ডার করুন</h2>

    <input type="text" placeholder="আপনার নাম">

    <input type="tel" placeholder="মোবাইল নম্বর">

    <select>
      <option>সাইজ নির্বাচন করুন</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
      <option>XXL</option>
    </select>

    <input type="number" placeholder="পরিমাণ">

    <textarea placeholder="সম্পূর্ণ ঠিকানা"></textarea>

    <button class="confirm-btn">অর্ডার কনফার্ম করুন</button>
      
<div id="orderSuccess" style="display:none; margin-top:15px;">

    <p><strong>✅ আপনার অর্ডার সফল হয়েছে!</strong></p>

    <p>Order ID:
        <span id="orderId"></span>
    </p>

    <button id="whatsappBtn">
        WhatsApp-এ অর্ডার পাঠান
    </button>

</div>
    <button class="close-btn">বন্ধ করুন</button>

  </div>

</div>
<body>

<header class="rt-header">

    <button class="menu-btn">☰</button>

    <div class="brand">

        <img src="images/logo.png" alt="রঙতুলি ফ্যাশন হাউজ" class="logo">

        <div class="brand-text">
            <h1>রঙতুলি ফ্যাশন হাউজ</h1>
            <p>আপনাদের বিশ্বস্তের ফ্যাশন সঙ্গী</p>
        </div>

    </div>

    <div class="search-box">
        <input type="search" placeholder="পণ্য খুঁজুন...">
        <button>🔍</button>
    </div>

</header>

<section class="hero-banner">

    <img src="images/banner.jpg" alt="Banner">

</section>

<section class="quick-menu">

    <button>প্রিমিয়াম</button>
    <button>নতুন</button>
    <button>ডিসকাউন্ট</button>

</section>

<section class="category-scroll">

    <button>টি-শার্ট</button>
    <button>পলো</button>
    <button>শার্ট</button>
    <button>পাঞ্জাবি</button>
    <button>জিন্স</button>
    <button>প্যান্ট</button>

</section>

<section class="products">

    <h2>আমাদের কালেকশন</h2>

    <div class="product-grid">

    <div class="product-card">

    <span class="discount-badge">২০% ছাড়</span>

    <img src="images/products/tshirt1.jpg" alt="প্রিমিয়াম টি-শার্ট">

    <div class="product-info">

        <h3>প্রিমিয়াম কটন টি-শার্ট</h3>

        <p class="price">
            <del>৳১,২৫০</del>
            <strong>৳৯৯০</strong>
        </p>

        <button class="order-btn">🛒 অর্ডার করুন</button>

    </div>

</div>

<div class="product-card">

    <img src="images/products/polo1.jpg" alt="প্রিমিয়াম পলো">

    <div class="product-info">

        <h3>প্রিমিয়াম পলো শার্ট</h3>

        <p class="price">
            <strong>৳১,২৯০</strong>
        </p>

        <button class="order-btn">🛒 অর্ডার করুন</button>

    </div>

</div>

    </div>

</section>

</body>
</html>
