<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রঙতুলি ফ্যাশন হাউজ</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header class="rt-header">

    <button class="menu-btn">☰</button>

    <div class="brand">

        <img src="images/logo.png" alt="রঙতুলি ফ্যাশন হাউজ" class="logo">

        <div class="brand-text">
            <h1>রঙতুলি ফ্যাশন হাউজ</h1>
            <p>আপনাদের বিশ্বস্তের ফ্যাশন সঙ্গী</p>
        </div>

    </div>

    <div class="search-box">
        <input type="search" placeholder="পণ্য খুঁজুন...">
        <button>🔍</button>
    </div>

</header>

<section class="hero-banner">

    <img src="images/banner.jpg" alt="Banner">

</section>

<section class="quick-menu">

    <button>প্রিমিয়াম</button>
    <button>নতুন</button>
    <button>ডিসকাউন্ট</button>

</section>

<section class="category-scroll">

    <button>টি-শার্ট</button>
    <button>পলো</button>
    <button>শার্ট</button>
    <button>পাঞ্জাবি</button>
    <button>জিন্স</button>
    <button>প্যান্ট</button>

</section>

<section class="products">

    <h2>আমাদের কালেকশন</h2>

    <div class="product-grid">

        <!-- Product Card এখানে যোগ হবে -->

    </div>

</section>

</body>
</html>
